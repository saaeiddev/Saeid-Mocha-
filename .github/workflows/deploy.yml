name: Build, test and deploy SAEID & MOCHA
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout existing repository
        uses: actions/checkout@v4
      - name: Restore checked-in source bundle
        shell: bash
        run: |
          set -euo pipefail
          echo "383be1363603c564048ee53efafda0be8fe920c1b43cc9a07694f0b739a4dcb2  source-archive/source.tar.xz" | sha256sum -c -
          tar -xJf source-archive/source.tar.xz
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run gameplay unit tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
        continue-on-error: true
      - name: Build production game
        run: npm run build
      - name: Publish extracted, browsable source into main
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md index.html package.json tsconfig.json vite.config.ts src/ public/ tests/
          if ! git diff --cached --quiet; then
            git commit -m "Publish playable SAEID & MOCHA source and sprites"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload production assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
